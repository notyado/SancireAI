<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="SancireAI — интеллектуальный помощник по регламентам и документам" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SancireAI — интеллектуальный помощник</title>
    <script>
      try {
        var theme = localStorage.getItem("sancire-theme") || "dark";
        var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(isDark ? "dark" : "light");
      } catch (_) { document.documentElement.classList.add("dark"); }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
